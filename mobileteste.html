    <div id="oc-list" class="flex flex-col gap-2 pb-16"></div>

  </div>

  <div id="view-pos" class="hidden-section no-print">

    <button onclick="openPosProductModal()" class="w-full bg-blue-700 text-white p-3 rounded-xl font-bold flex justify-center items-center gap-2 shadow-lg mb-4 active:scale-95 transition-transform text-sm"><i data-lucide="search" class="w-4 h-4"></i> Buscar Material</button>

        function formatMoney(val) { return parseFloat(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function formatDate(d) { try { return d ? new Date(d).toLocaleDateString('pt-BR', {timeZone: 'UTC'}) : '-'; } catch(e) { return '-'; } }
        function showLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
        function showToast(msg, isError) { 
            const t=document.getElementById('toast'); 
            t.textContent=msg; t.className=`fixed top-5 right-5 px-6 py-3 rounded-lg shadow-xl text-white font-medium z-50 ${isError?'bg-red-600':'bg-slate-800'}`;

        function getTodayDate() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function fetchAllRecords(table) {
            let allRecords = []; let from = 0; const step = 1000; let keepFetching = true;
            while (keepFetching) {
                const { data, error } = await sb.from(table).select('*').range(from, from + step - 1);
                if (error) throw error;
                if (data && data.length > 0) {
                    allRecords.push(...data);
                    if (data.length < step) keepFetching = false;
                    else from += step;
                } else keepFetching = false;
            }
            return { data: allRecords };
        }

        async function loadData() {
    try {
        const [
          resObras, resForn, resProd, resLog,
          resEqp, resFases, resPonto, resTerc,
          resPontoDiario, resHistPrecos, resProdTerc
        ] = await Promise.all([
          fetchAllRecords('jsp_obras'),
          fetchAllRecords('jsp_fornecedores'),
          fetchAllRecords('jsp_produtos'),
          fetchAllRecords('jsp_logs'),
          fetchAllRecords('jsp_equipe').catch(() => ({ data: [] })),
          fetchAllRecords('jsp_fase').catch(() => ({ data: [] })),
          fetchAllRecords('jsp_ponto').catch(() => ({ data: [] })),
          fetchAllRecords('jsp_terceirizados').catch(() => ({ data: [] })),
          fetchAllRecords('jsp_ponto_diario').catch(() => ({ data: [] })),
          fetchAllRecords('jsp_historico_precos').catch(() => ({ data: [] })),
          fetchAllRecords('jsp_producao_terc').catch(() => ({ data: [] }))
        ]);

        STATE.obras = resObras.data || [];
        STATE.fornecedores = resForn.data || [];
        STATE.produtos = resProd.data || [];
        STATE.logs = resLog.data || [];
        STATE.equipe = resEqp.data || [];
        STATE.fases = (resFases.data || []).sort((a,b) => a.ordem - b.ordem);
        STATE.ponto = resPonto.data || [];
        STATE.terceirizados = resTerc.data || [];
        STATE.ponto_diario = resPontoDiario.data || []; 
        STATE.historico_precos = resHistPrecos.data || [];
        STATE.producao_terc = resProdTerc.data || [];
        //console.log("Histórico de Preços carregado:", STATE.historico_precos);
        // Garante que data_preco seja string 'yyyy-mm-dd'
        STATE.historico_precos = STATE.historico_precos.map(r => ({
          ...r,
          data_preco: typeof r.data_preco === 'string' ? r.data_preco : r.data_preco instanceof Date ? r.data_preco.toISOString().split('T')[0] : r.data_preco
        }));

      
  
 



        if (dadosUsuario.nivel === 'admin') {
            const navUsersBtn = document.getElementById('nav-users');
            if (navUsersBtn) navUsersBtn.classList.remove('hidden');
            const resUsers = await fetchAllRecords('jsp_usuarios');
            STATE.users = resUsers.data || [];
        }

        updateSelects();
        if(!document.querySelector('.active-section')) navigate('dash');
        else navigate(document.querySelector('.active-section').id.replace('view-',''));
        showLoading(false);
    } catch (err) {
        showLoading(false);
        showToast("Erro ao conectar no banco: " + err.message, true);
    }
}

  // Renderização específica da equipe para mobile (cards com botões)
  function renderEquipeMobile() {
    // Esta função usa o STATE (vindo do shared.js) e as funções de cálculo
    // como getColaboradoresUnificados(), calcularSaldoPendenteFuncionarioPorPeriodo()
    const term = document.getElementById('eqp-search').value.toLowerCase();
    const filterObra = document.getElementById('eqp-filter-obra').value;
    const filterStatus = document.getElementById('eqp-filter-status').value;
    const filterTipo = document.getElementById('eqp-filter-tipo').value;
    const dataInicio = document.getElementById('eqp-filter-data-inicio').value;
    const dataFim = document.getElementById('eqp-filter-data-fim').value;
    const colaboradores = getColaboradoresUnificados(); // do shared.js
    
    let fil = colaboradores.filter(c => (c.nome||'').toLowerCase().includes(term) || (c.categoria||'').toLowerCase().includes(term));
    if (filterObra) fil = fil.filter(c => String(c.obra_atual_id) === String(filterObra));
    if (filterStatus !== "todos") { const isAtivo = filterStatus === "true"; fil = fil.filter(c => (c.ativo === true || c.ativo === 'true') === isAtivo); }
    if (filterTipo !== 'todos') fil = fil.filter(c => c.tipo === filterTipo);
    fil.sort((a,b) => (a.nome||'').localeCompare(b.nome||''));

    document.getElementById('equipe-list').innerHTML = fil.map(c => {
      const obra = STATE.obras.find(x => x.id == c.obra_atual_id);
      const nomeObra = obra ? obra.nome : 'Sem obra alocada';
      const isAtivo = c.ativo === true || c.ativo === 'true';
      const tipoBadge = c.tipo === 'diaria' ? '<span class="bg-blue-100 text-blue-700 text-[8px] font-bold px-1.5 py-0.5 rounded ml-1">DIÁRIA</span>' : '<span class="bg-purple-100 text-purple-700 text-[8px] font-bold px-1.5 py-0.5 rounded ml-1">METRO</span>';
      const valorExibicao = c.tipo === 'diaria' ? formatMoney(c.valor_base) : `${formatMoney(c.valor_base)}/m`;
      
      let quantidadePendente = 0;
      let valorPendente = 0;
      if (c.tipo === 'diaria') {
        quantidadePendente = calcularSaldoPendenteFuncionarioPorPeriodo(c.id, dataInicio, dataFim); // do shared.js
        valorPendente = quantidadePendente * c.valor_base;
      } else {
        quantidadePendente = calcularMetrosPendentesPorPeriodo(c.id, dataInicio, dataFim); // do shared.js
        valorPendente = quantidadePendente * c.valor_base;
      }
      
      let zapBtn = ''; if(c.telefone) { const numZap = c.telefone.replace(/\D/g, ''); if(numZap.length >= 10) zapBtn = `<a href="https://wa.me/55${numZap}" target="_blank" class="p-1.5 bg-green-100 text-green-600 rounded-lg shrink-0 flex items-center justify-center"><i data-lucide="message-circle" class="w-4 h-4"></i></a>`; }
      
      let botoesAcao = '';
      if (c.tipo === 'diaria') {
        botoesAcao = `
          <button onclick="abrirModalSaldo('${c.id}')" class="p-1.5 bg-indigo-600 text-white rounded-lg text-[10px] font-bold shadow">CALCULAR</button>
          <button onclick="abrirModalDocumentos('${c.id}')" class="p-1.5 bg-slate-800 text-white rounded-lg" title="Contratos"><i data-lucide="file-text" class="w-3 h-3"></i></button>
          <button onclick="openEquipeForm('${c.id}')" class="p-1.5 bg-slate-100 text-blue-600 rounded-lg"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
          ${zapBtn}
        `;
      } else {
        botoesAcao = `
          <button onclick="abrirModalSaldoMetros('${c.id}')" class="p-1.5 bg-slate-800 text-white rounded-lg text-[10px] font-bold shadow">MEDIÇÃO</button>
          <button onclick="abrirModalDocumentos('${c.id}')" class="p-1.5 bg-slate-800 text-white rounded-lg" title="Contratos"><i data-lucide="file-text" class="w-3 h-3"></i></button>
          <button onclick="openEquipeForm('${c.id}', 'terceirizado')" class="p-1.5 bg-slate-100 text-blue-600 rounded-lg"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
          ${zapBtn}
        `;
      }

      return `
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm relative">
        <div class="absolute top-2 right-2 flex gap-1 items-center">
          ${c.tipo === 'diaria' ? `<span class="bg-slate-100 text-slate-500 border border-slate-200 text-[8px] font-bold px-1.5 py-0.5 rounded">Mat: ${c.matricula || '-'}</span>` : ''}
          <span class="${isAtivo?'bg-green-100 text-green-700':'bg-red-100 text-red-700'} text-[8px] font-bold px-1.5 py-0.5 rounded">${isAtivo?'ATIVO':'INATIVO'}</span>
        </div>
        <div class="flex justify-between items-start mb-1 pr-24">
          <div>
            <h4 class="font-bold text-slate-800 text-xs flex items-center">${c.nome} ${tipoBadge}</h4>
            <p class="text-[10px] text-slate-500 font-bold uppercase mt-1">${c.categoria} ${c.telefone ? `| ${c.telefone}` : ''}</p>
            <p class="text-[9px] text-blue-600 mt-0.5"><i data-lucide="building" class="inline w-3 h-3"></i> ${nomeObra}</p>
            <div class="flex flex-wrap items-baseline gap-2 mt-1">
              <span class="text-[10px] font-bold text-slate-700">${valorExibicao}</span>
              <span class="text-[9px] text-orange-600 font-bold">${quantidadePendente.toFixed(2)} ${c.tipo==='diaria'?'dias pend.':'m pend.'}</span>
              <span class="text-[11px] font-black text-green-600">${formatMoney(valorPendente)}</span>
            </div>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-2 pt-2 border-t border-slate-50">
          ${botoesAcao}
        </div>
      </div>`;
    }).join('');
    lucide.createIcons();
  }
