<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RV Negócios - Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

  <!-- ARQUIVO COMPARTILHADO (TODAS AS FUNÇÕES DE NEGÓCIO) -->
  <script src="js/shared.js"></script>

  <link rel="icon" type="image/png" href="logo.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <style>
    /* (mesmo CSS anterior, omitido por brevidade – mantenha o mesmo do seu projeto) */
    body { background-color: #f1f5f9; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
    .hidden-section { display: none !important; }
    .active-section { display: block !important; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .loader { border: 3px solid #e2e8f0; border-top: 3px solid #1d4ed8; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .mobile-modal { transition: transform 0.3s ease-in-out; }
    .modal-hidden { transform: translateY(100%); }
    .modal-visible { transform: translateY(0); }
    .nav-active { background-color: #eff6ff; color: #1d4ed8 !important; border-radius: 12px; }
    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      body { background: white; margin: 0; padding: 0; font-family: 'Helvetica', 'Arial', sans-serif; color: #1e293b; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      header, nav, main, #loading, #toast, .no-print { display: none !important; }
      #print-area { display: block !important; }
    }
    .print-only { display: none; }
    #print-area.print-active { display: block; position: absolute; top: 0; left: 0; width: 100%; background: white; z-index: 9999; }
  </style>
</head>
<body class="pb-20 text-slate-800">

<header class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center no-print">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-full bg-white p-0.5 overflow-hidden">
      <img src="logo.png" class="w-full h-full object-contain" />
    </div>
    <h1 class="font-bold tracking-wide text-blue-400">RV NEGÓCIOS</h1>
  </div>
  <div class="flex gap-4 items-center">
    <button onclick="window.location.reload()" class="text-slate-400 hover:text-blue-400"><i data-lucide="refresh-cw"></i></button>
    <button onclick="fazerLogout()" class="text-slate-400 hover:text-red-400"><i data-lucide="log-out"></i></button>
  </div>
</header>

<div id="loading" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center">
  <div class="bg-white p-6 rounded-2xl flex flex-col items-center shadow-2xl"><div class="loader mb-3"></div><span class="font-bold text-slate-700 text-sm">Aguarde...</span></div>
</div>
<div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl text-white font-bold text-sm z-[100] transition-all text-center w-[90%] max-w-sm"></div>

<main class="p-4" id="main-content">
  <!-- ====================== VIEWS (IGUAL AO SEU ORIGINAL) ====================== -->
  <!-- Para economizar espaço, mantenha exatamente as mesmas divs que você já tinha:
       view-dash, view-oc, view-pos, view-fin, view-menu, view-fornecedores, view-prod, view-equipe -->
  <!-- Copie o HTML completo do seu mobile.html original aqui -->
</main>

<nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around items-center pb-safe pt-1 pb-1 z-40 no-print shadow-[0_-5px_15px_-5px_rgba(0,0,0,0.05)] px-2">
  <button onclick="navigate('dash')" id="btn-dash" class="flex flex-col items-center p-2 text-slate-400 nav-bottom-btn w-1/4 transition-colors"><i data-lucide="layout-dashboard" class="w-5 h-5 mb-1"></i><span class="text-[10px] font-bold">Visão</span></button>
  <button onclick="navigate('oc')" id="btn-oc" class="flex flex-col items-center p-2 text-slate-400 nav-bottom-btn w-1/4 transition-colors"><i data-lucide="file-text" class="w-5 h-5 mb-1"></i><span class="text-[10px] font-bold">O.C.</span></button>
  <button onclick="navigate('fin')" id="btn-fin" class="flex flex-col items-center p-2 text-slate-400 nav-bottom-btn w-1/4 transition-colors"><i data-lucide="bar-chart-3" class="w-5 h-5 mb-1"></i><span class="text-[10px] font-bold">Financeiro</span></button>
  <button onclick="navigate('menu')" id="btn-menu" class="flex flex-col items-center p-2 text-slate-400 nav-bottom-btn w-1/4 transition-colors"><i data-lucide="menu" class="w-5 h-5 mb-1"></i><span class="text-[10px] font-bold">Menu</span></button>
</nav>

<!-- ====================== MODAIS GERAIS (IGUAL AO SEU ORIGINAL) ====================== -->
<!-- Copie todos os modais (pos-product-modal, pos-fornecedor-modal, modal-view-oc, overlay-forms, etc.) do seu mobile.html original -->
<div id="pos-product-modal" class="fixed inset-0 bg-white z-50 flex flex-col mobile-modal modal-hidden no-print">...</div>
<div id="pos-fornecedor-modal" class="fixed inset-0 bg-white z-50 flex flex-col mobile-modal modal-hidden no-print">...</div>
<div id="modal-view-oc" class="fixed inset-0 bg-white z-[80] flex flex-col mobile-modal modal-hidden no-print">...</div>
<div id="overlay-forms" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-end justify-center no-print">
  <!-- Inclua todos os forms: equipe-form-container, modal-docs-equipe, modal-saldo-ponto, modal-saldo-metros, modal-folha-pagamento, modal-confirm-oc -->
</div>
<div id="modal-sucesso-matricula" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[110] flex items-center justify-center p-4 no-print">...</div>
<div id="print-area" class="print-only"></div>

<script>
  // ==================== CÓDIGO ESPECÍFICO DO MOBILE (USANDO SHARED.JS) ====================
  // ATENÇÃO: As variáveis globais (sb, STATE, etc.) e funções (loadData, formatMoney, abrirModalSaldo, etc.)
  // já estão definidas em shared.js. Aqui só declaramos o necessário para o mobile.

  // 1. Verificar login e obter dados do usuário (próprio do mobile)
  let dadosUsuario = null;
  const userSessao = localStorage.getItem('rv_user');
  if (!userSessao) {
    window.location.replace('index.html');
  } else {
    dadosUsuario = JSON.parse(userSessao);
  }

  // 2. Funções de navegação mobile (específicas)
  function navigate(viewId) {
    document.querySelectorAll('main > div[id^="view-"]').forEach(el => {
      el.classList.add('hidden-section');
      el.classList.remove('active-section');
    });
    const target = document.getElementById('view-' + viewId);
    if (target) {
      target.classList.remove('hidden-section');
      target.classList.add('active-section');
    }
    document.querySelectorAll('.nav-bottom-btn').forEach(btn => btn.classList.remove('nav-active', 'text-blue-700'));
    const activeBtn = document.getElementById('btn-' + viewId);
    if (activeBtn && viewId !== 'pos') activeBtn.classList.add('nav-active');
    
    // Chama as funções de renderização (que estão em shared.js)
    if (viewId === 'dash') renderDashboard();
    if (viewId === 'oc') { updateSelects(); renderOCList(); }
    if (viewId === 'fin') { updateSelects(); renderFinance(); }
    if (viewId === 'fornecedores') renderFornecedores();
    if (viewId === 'prod') renderProducts();
    if (viewId === 'equipe') { updateSelects(); renderEquipeMobile(); }
    
    lucide.createIcons();
    window.scrollTo(0, 0);
  }

  function openNovaOC() {
    document.getElementById('view-oc').classList.replace('active-section', 'hidden-section');
    document.getElementById('view-pos').classList.replace('hidden-section', 'active-section');
    updateSelects();
    window.scrollTo(0, 0);
  }
  function closeNovaOC() {
    document.getElementById('view-pos').classList.replace('active-section', 'hidden-section');
    document.getElementById('view-oc').classList.replace('hidden-section', 'active-section');
    clearCart();       // definida em shared.js
    renderOCList();
  }
  function toggleFinTab(tab) {
    const secDesp = document.getElementById('fin-section-despesas');
    const secRec = document.getElementById('fin-section-receitas');
    if (secDesp && secRec) {
      if (tab === 'despesas') {
        secDesp.classList.remove('hidden');
        secRec.classList.add('hidden');
        document.getElementById('tab-despesas').classList.replace('text-slate-500', 'text-slate-800');
        document.getElementById('tab-despesas').classList.add('bg-white', 'shadow-sm');
        document.getElementById('tab-receitas').classList.replace('text-slate-800', 'text-slate-500');
        document.getElementById('tab-receitas').classList.remove('bg-white', 'shadow-sm');
      } else {
        secDesp.classList.add('hidden');
        secRec.classList.remove('hidden');
        document.getElementById('tab-receitas').classList.replace('text-slate-500', 'text-slate-800');
        document.getElementById('tab-receitas').classList.add('bg-white', 'shadow-sm');
        document.getElementById('tab-despesas').classList.replace('text-slate-800', 'text-slate-500');
        document.getElementById('tab-despesas').classList.remove('bg-white', 'shadow-sm');
      }
    }
  }

  // 3. Renderização específica da equipe no mobile (cards com pendências e botões)
  // Esta função usa funções do shared.js: getColaboradoresUnificados, formatMoney, calcularSaldoPendenteFuncionarioPorPeriodo, etc.
  function renderEquipeMobile() {
    const term = document.getElementById('eqp-search')?.value.toLowerCase() || '';
    const filterObra = document.getElementById('eqp-filter-obra')?.value || '';
    const filterStatus = document.getElementById('eqp-filter-status')?.value || 'true';
    const filterTipo = document.getElementById('eqp-filter-tipo')?.value || 'todos';
    const dataInicio = document.getElementById('eqp-filter-data-inicio')?.value || '';
    const dataFim = document.getElementById('eqp-filter-data-fim')?.value || '';
    
    // Garantir que a função getColaboradoresUnificados existe (vem do shared.js)
    if (typeof getColaboradoresUnificados !== 'function') {
      console.error('getColaboradoresUnificados não está definida. Verifique shared.js');
      return;
    }
    const colaboradores = getColaboradoresUnificados();
    
    let fil = colaboradores.filter(c => 
      (c.nome || '').toLowerCase().includes(term) || 
      (c.categoria || '').toLowerCase().includes(term)
    );
    if (filterObra) fil = fil.filter(c => String(c.obra_atual_id) === String(filterObra));
    if (filterStatus !== 'todos') {
      const isAtivo = filterStatus === 'true';
      fil = fil.filter(c => (c.ativo === true || c.ativo === 'true') === isAtivo);
    }
    if (filterTipo !== 'todos') fil = fil.filter(c => c.tipo === filterTipo);
    fil.sort((a,b) => (a.nome || '').localeCompare(b.nome || ''));
    
    const container = document.getElementById('equipe-list');
    if (!container) return;
    
    container.innerHTML = fil.map(c => {
      const obra = STATE.obras.find(x => x.id == c.obra_atual_id);
      const nomeObra = obra ? obra.nome : 'Sem obra alocada';
      const isAtivo = c.ativo === true || c.ativo === 'true';
      const tipoBadge = c.tipo === 'diaria' 
        ? '<span class="bg-blue-100 text-blue-700 text-[8px] font-bold px-1.5 py-0.5 rounded ml-1">DIÁRIA</span>'
        : '<span class="bg-purple-100 text-purple-700 text-[8px] font-bold px-1.5 py-0.5 rounded ml-1">METRO</span>';
      const valorExibicao = c.tipo === 'diaria' ? formatMoney(c.valor_base) : `${formatMoney(c.valor_base)}/m`;
      
      let quantidadePendente = 0;
      let valorPendente = 0;
      if (c.tipo === 'diaria') {
        if (typeof calcularSaldoPendenteFuncionarioPorPeriodo === 'function') {
          quantidadePendente = calcularSaldoPendenteFuncionarioPorPeriodo(c.id, dataInicio, dataFim);
          valorPendente = quantidadePendente * c.valor_base;
        }
      } else {
        if (typeof calcularMetrosPendentesPorPeriodo === 'function') {
          quantidadePendente = calcularMetrosPendentesPorPeriodo(c.id, dataInicio, dataFim);
          valorPendente = quantidadePendente * c.valor_base;
        }
      }
      
      let zapBtn = '';
      if (c.telefone) {
        const numZap = c.telefone.replace(/\D/g, '');
        if (numZap.length >= 10) {
          zapBtn = `<a href="https://wa.me/55${numZap}" target="_blank" class="p-1.5 bg-green-100 text-green-600 rounded-lg shrink-0 flex items-center justify-center"><i data-lucide="message-circle" class="w-4 h-4"></i></a>`;
        }
      }
      
      let botoesAcao = '';
      if (c.tipo === 'diaria') {
        botoesAcao = `
          <button onclick="abrirModalSaldo('${c.id}')" class="p-1.5 bg-indigo-600 text-white rounded-lg text-[10px] font-bold shadow">CALCULAR</button>
          <button onclick="abrirModalDocumentos('${c.id}')" class="p-1.5 bg-slate-800 text-white rounded-lg" title="Contratos"><i data-lucide="file-text" class="w-3 h-3"></i></button>
          <button onclick="openEquipeForm('${c.id}')" class="p-1.5 bg-slate-100 text-blue-600 rounded-lg"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
          ${zapBtn}
        `;
      } else {
        botoesAcao = `
          <button onclick="abrirModalSaldoMetros('${c.id}')" class="p-1.5 bg-slate-800 text-white rounded-lg text-[10px] font-bold shadow">MEDIÇÃO</button>
          <button onclick="abrirModalDocumentos('${c.id}')" class="p-1.5 bg-slate-800 text-white rounded-lg" title="Contratos"><i data-lucide="file-text" class="w-3 h-3"></i></button>
          <button onclick="openEquipeForm('${c.id}', 'terceirizado')" class="p-1.5 bg-slate-100 text-blue-600 rounded-lg"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
          ${zapBtn}
        `;
      }
      
      return `
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm relative">
        <div class="absolute top-2 right-2 flex gap-1 items-center">
          ${c.tipo === 'diaria' ? `<span class="bg-slate-100 text-slate-500 border border-slate-200 text-[8px] font-bold px-1.5 py-0.5 rounded">Mat: ${c.matricula || '-'}</span>` : ''}
          <span class="${isAtivo ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} text-[8px] font-bold px-1.5 py-0.5 rounded">${isAtivo ? 'ATIVO' : 'INATIVO'}</span>
        </div>
        <div class="flex justify-between items-start mb-1 pr-24">
          <div>
            <h4 class="font-bold text-slate-800 text-xs flex items-center">${c.nome} ${tipoBadge}</h4>
            <p class="text-[10px] text-slate-500 font-bold uppercase mt-1">${c.categoria} ${c.telefone ? `| ${c.telefone}` : ''}</p>
            <p class="text-[9px] text-blue-600 mt-0.5"><i data-lucide="building" class="inline w-3 h-3"></i> ${nomeObra}</p>
            <div class="flex flex-wrap items-baseline gap-2 mt-1">
              <span class="text-[10px] font-bold text-slate-700">${valorExibicao}</span>
              <span class="text-[9px] text-orange-600 font-bold">${quantidadePendente.toFixed(2)} ${c.tipo === 'diaria' ? 'dias pend.' : 'm pend.'}</span>
              <span class="text-[11px] font-black text-green-600">${formatMoney(valorPendente)}</span>
            </div>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-2 pt-2 border-t border-slate-50">
          ${botoesAcao}
        </div>
      </div>`;
    }).join('');
    
    lucide.createIcons();
  }

  // 4. Inicialização
  window.onload = function() {
    if (!dadosUsuario) return;
    showLoading(true);
    // A função loadData() deve vir do shared.js
    if (typeof loadData === 'function') {
      loadData().then(() => {
        // Configurar datas padrão da equipe
        const hoje = new Date();
        const anoAtual = hoje.getFullYear();
        const primeiroDia = `${anoAtual}-01-01`;
        const ultimoDia = new Date(anoAtual, hoje.getMonth() + 1, 0).getDate();
        const ultimoDiaStr = `${anoAtual}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(ultimoDia).padStart(2, '0')}`;
        const inputInicio = document.getElementById('eqp-filter-data-inicio');
        const inputFim = document.getElementById('eqp-filter-data-fim');
        if (inputInicio) inputInicio.value = primeiroDia;
        if (inputFim) inputFim.value = ultimoDiaStr;
        
        renderEquipeMobile();
        showLoading(false);
      }).catch(err => {
        showLoading(false);
        showToast("Erro ao carregar dados: " + err.message, true);
      });
    } else {
      console.error('loadData não definida. Verifique shared.js');
      showLoading(false);
    }
    lucide.createIcons();
  };

  // 5. Logout
  function fazerLogout() {
    localStorage.removeItem('rv_user');
    window.location.replace('index.html');
  }

  // 6. Expor funções usadas nos botões
  window.navigate = navigate;
  window.openNovaOC = openNovaOC;
  window.closeNovaOC = closeNovaOC;
  window.toggleFinTab = toggleFinTab;
  window.renderEquipeMobile = renderEquipeMobile;
  window.fazerLogout = fazerLogout;
  // As funções a seguir já estão no escopo global via shared.js:
  // abrirModalSaldo, fecharModalSaldo, abrirModalSaldoMetros, abrirModalDocumentos,
  // openEquipeForm, saveEquipe, imprimirChecagem, abrirModalFolhaPagamento, etc.
</script>

</body>
</html>
